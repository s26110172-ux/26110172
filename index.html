<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 - 大航海風格</title>
  
  <!-- 引入 Google Fonts 復古與航海風字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 視覺主題設定 (航海/牛皮紙/羊皮紙色調變數)
          👉 你可以在這裡修改主要顏色的色碼！
       ========================================================================== */
    :root {
      /* 背景與水域顏色 */
      --ocean-deep: #0b1d28;         /* 深海夜藍 */
      --ocean-wave: #163244;         /* 海浪深藍 */

      /* 羊皮紙與牛皮紙卡片顏色 */
      --parchment-bg: #f4e8c1;       /* 羊皮紙主色 */
      --card-bg: #eddcb0;            /* 復古牛皮紙卡片背景 */
      --card-border: #8b5a2b;        /* 卡片邊框（黃銅/皮革棕） */

      /* 文字顏色 */
      --text-ink: #2b1d0c;           /* 墨水深褐色 (主文字) */
      --text-muted: #6e5235;         /* 淡褐色 (次要資訊與時間) */

      /* 高亮與特效顏色 (寶藏光芒) */
      --gold-bright: #ffd700;        /* 亮金黃色 */
      --gold-glow: rgba(255, 215, 0, 0.6); /* 金光發光半透明色 */
      --compass-red: #a82e2e;        /* 羅盤赤紅標示 */

      /* 輪播與視覺字體 */
      --font-title: 'Cinzel', 'Noto Serif TC', serif;
      --font-body: 'Noto Serif TC', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ocean-deep);
      /* 經典海洋波紋與羊皮紙風格背景 */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(22, 50, 68, 0.8) 0%, transparent 80%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 2px, transparent 2px, transparent 10px);
      color: var(--text-ink);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 頁頭標題區：航海圖繪製風格 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--parchment-bg);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.4);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* 標題旁的小羅盤圖示裝飾 */
    h1::before, h1::after {
      content: '⚓';
      font-size: 2rem;
      color: var(--gold-bright);
      text-shadow: 0 0 10px var(--gold-glow);
    }

    p.subtitle {
      color: #c9b085;
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* ==========================================================================
       2. 讀取中（Loading）航海船舵旋轉動畫
       ========================================================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
    }

    /* 旋轉羅盤 / 船舵動畫 */
    .helm-spinner {
      width: 80px;
      height: 80px;
      border: 6px double var(--gold-bright);
      border-radius: 50%;
      position: relative;
      animation: spinHelm 3s linear infinite;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    /* 船舵內部十字箭頭與指針 */
    .helm-spinner::before {
      content: '☸';
      font-size: 65px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      color: var(--parchment-bg);
    }

    @keyframes spinHelm {
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1.8rem;
      font-size: 1.3rem;
      font-family: var(--font-title);
      letter-spacing: 4px;
      color: var(--parchment-bg);
      text-shadow: 0 0 10px var(--gold-glow);
      animation: waveText 1.5s ease-in-out infinite alternate;
    }

    @keyframes waveText {
      0% { opacity: 0.4; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(-5px); }
    }

    /* ==========================================================================
       3. 瀑布流版面（Masonry Layout）與牛皮紙卡片
       ========================================================================== */
    #board {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      
      /* 使用 CSS Column 實現高低錯落瀑布流 */
      column-count: 3;
      column-gap: 1.8rem;
      display: none; /* 資料讀取完成前先隱藏 */
    }

    /* 響應式斷點：依裝置寬度自動調格數 */
    @media (max-width: 900px) { #board { column-count: 2; } }
    @media (max-width: 600px) { #board { column-count: 1; } }

    /* 留言卡片：復古羊皮紙/航海日誌風格 */
    .card {
      background: var(--card-bg);
      background-image: radial-gradient(circle at 100% 0%, rgba(139, 90, 43, 0.15) 0%, transparent 70%);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.8rem;
      break-inside: avoid; /* 防止卡片在瀑布流中被拆斷成兩半 */
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
      position: relative;

      /* 平滑過渡動畫 (針對縮放、邊框與發光) */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0.85;
      filter: brightness(0.85) blur(0px);
    }

    /* 卡片四角的復古金屬/鉚釘裝飾點 */
    .card::before {
      content: '⚓';
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 1.2rem;
      color: var(--card-border);
      opacity: 0.4;
    }

    /* 卡片標題（留言者與時間） */
    .card-header {
      border-bottom: 2px dashed var(--card-border);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .author-name {
      font-weight: 900;
      font-size: 1.2rem;
      color: #4a2c11;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .author-name::before {
      content: '🏴‍☠️';
      font-size: 1.1rem;
    }

    .time-stamp {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    /* 卡片內容區域 */
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .qa-item {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .qa-label {
      font-size: 0.85rem;
      color: var(--compass-red);
      font-weight: bold;
      display: block;
      margin-bottom: 0.2rem;
    }

    .qa-text {
      color: var(--text-ink);
      word-break: break-word;
      font-weight: 500;
    }

    /* 重點留言（想對我說的話）：特別呈現為航海封印盒風格 */
    .main-message {
      background: rgba(139, 90, 43, 0.1);
      border-left: 4px solid var(--compass-red);
      padding: 0.8rem;
      border-radius: 0 6px 6px 0;
      margin-top: 0.4rem;
    }

    /* ==========================================================================
       4. 計時器輪播『寶藏亮起 Highlight』與周圍變暗特效
          👉 高亮與輪播發光效果在此設定！
       ========================================================================== */
    
    /* 🎯 當卡片被輪播選中時 (Highlight 狀態) */
    .card.highlight {
      transform: scale(1.08) translateY(-5px); /* 放大並微微浮起 */
      z-index: 10;                              /* 確保在最上層 */
      opacity: 1;
      filter: brightness(1.15) blur(0px);       /* 提高亮度，消除模糊 */
      
      /* 金黃色寶藏發光邊框與陰影 */
      border-color: var(--gold-bright);
      box-shadow: 
        0 0 25px var(--gold-glow),
        0 10px 25px rgba(0, 0, 0, 0.7),
        inset 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* 當畫面進入輪播狀態時，其他「未選中」卡片的視覺處理 */
    #board.has-active .card:not(.highlight) {
      opacity: 0.35;                            /* 稍微變暗透明 */
      filter: brightness(0.6) blur(1.5px);      /* 降低亮度並稍微模糊 */
      transform: scale(0.96);                  /* 微微縮小 */
    }
  </style>
</head>
<body>

  <!-- 頂部頁頭 -->
  <header>
    <h1>LOGBOOK OF FRIENDS</h1>
    <p class="subtitle">⚓ 朋友對我的航海日誌留言牆 ⚓</p>
  </header>

  <!-- 載入中 Cool 動畫 -->
  <div id="loading-container">
    <div class="helm-spinner"></div>
    <div class="loading-text" id="loading-status">讀取留言中...</div>
  </div>

  <!-- 瀑布流卡片牆 -->
  <main id="board"></main>

  <script>
    /* ==========================================================================
       5. 程式碼控制區 (Google CSV 網址、輪播秒數)
          👉 你可以在這裡修改輪播間隔秒數！
       ========================================================================== */

    // 1️⃣ Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKvMdMRSPW6viSlCyFGDPiXvl5FwYtSB8rAd-vTALO7UzY6w_xgPYwZlre0Z1nFHKdIKweGjTOV_-Q/pub?output=csv';

    // 2️⃣ 輪播卡片高亮的時間間隔 (單位：毫秒，3000 代表 3 秒)
    const CAROUSEL_INTERVAL_MS = 3000; 

    // 全局變數定義
    let cardsData = [];        // 解析後的卡片資料陣列
    let currentIndex = 0;      // 目前高亮的卡片索引
    let highlightTimer = null;   // setInterval 計時器物件

    /**
     * 自訂 CSV 解析器 (能夠妥善處理留言內容中含有逗號、換行或雙引號的狀況)
     * @param {string} text - 原始 CSV 文字資料
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') { // 處理轉義的雙引號 ""
            entry += '"';
            i++;
          } else { // 切換雙引號狀態
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) { // 遇不含在雙引號內的逗號 -> 切換欄位
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) { // 遇到換行 -> 切換列
          if (char === '\r' && nextChar === '\n') { i++; }
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') { lines.push(row); }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }
      
      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }
      
      return lines;
    }

    /**
     * 從 Google 試算表獲取 CSV 資料
     */
    async function fetchMessages() {
      const statusEl = document.getElementById('loading-status');
      try {
        // 發送 Fetch 請求，設定 redirect: 'follow' 避免轉址中斷
        const response = await fetch(CSV_URL, { redirect: 'follow' });
